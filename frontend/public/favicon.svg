<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" fill="#3b82f6" rx="40"/>
  
  <!-- Letter A with a gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Letter A -->
  <text x="96" y="140" font-family="Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="white" font-style="normal">A</text>
  
  <!-- Accent line underneath -->
  <line x1="50" y1="155" x2="142" y2="155" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
</svg>
